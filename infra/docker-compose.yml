services:
  api:
    build: ../backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env

  rsshub:
    image: diygod/rsshub:latest
    restart: always
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
      - CACHE_EXPIRE=600
      - TWITTER_AUTH_TOKEN=${TWITTER_AUTH_TOKEN:-}
